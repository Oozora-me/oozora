<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 迷失在大空中</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #e8e0d4;
            background: #0a0a14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .flame-bg {
            position: fixed;
            top: 50%; left: 50%;
            width: 400px; height: 400px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,140,0,0.15), transparent 70%);
            animation: pulse 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }
        .code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            margin-bottom: 0.5rem;
            animation: fadeUp 0.8s ease-out;
        }
        .msg {
            font-size: 1.1rem;
            color: rgba(232, 224, 212, 0.6);
            margin-bottom: 0.5rem;
            animation: fadeUp 0.8s ease-out 0.15s both;
        }
        .quote {
            font-size: 0.9rem;
            color: #ff8c00;
            font-style: italic;
            margin-bottom: 2.5rem;
            animation: fadeUp 0.8s ease-out 0.3s both;
        }
        .back {
            display: inline-block;
            padding: 0.6rem 2rem;
            border: 1px solid rgba(255,140,0,0.4);
            border-radius: 4px;
            color: #ff8c00;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            transition: all 0.3s;
            animation: fadeUp 0.8s ease-out 0.45s both;
        }
        .back:hover {
            background: #ff8c00;
            color: #0a0a14;
            box-shadow: 0 0 25px rgba(255,140,0,0.4);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* 浮动粒子 */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: drift linear infinite;
        }
        @keyframes drift {
            0%   { transform: translateY(0) scale(1); opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.2; }
            100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="flame-bg"></div>
    <div class="container">
        <div class="code">404</div>
        <p class="msg">这个页面似乎迷失在大空之中了…</p>
        <p class="quote">「即使迷失方向，大空之炎也会指引你回去」</p>
        <a href="/" class="back">← 返回首页</a>
    </div>
    <script>
        // 简单粒子效果
        const colors = ['#ff8c00', '#00bfff', '#ffd700', '#4169e1'];
        for (let i = 0; i < 15; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const s = Math.random() * 3 + 1;
            p.style.cssText = `
                width:${s}px; height:${s}px;
                left:${Math.random()*100}%; bottom:-10px;
                background:${colors[i%colors.length]};
                animation-duration:${Math.random()*8+6}s;
                animation-delay:${Math.random()*8}s;
            `;
            document.body.appendChild(p);
        }
    </script>
</body>
</html>
