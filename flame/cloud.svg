<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 钢制拐 (Tonfa) - 云雀恭弥 -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#808080"/>
      <stop offset="50%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#9370db" stroke-width="1" opacity="0.2"/>
  <g filter="url(#gl)">
    <!-- 左拐 -->
    <g transform="translate(70,100)">
      <!-- 横柄 -->
      <rect x="-5" y="-35" width="10" height="70" rx="3" fill="url(#steel)"/>
      <!-- 竖柄（握把） -->
      <rect x="-5" y="-35" width="10" height="55" rx="3" fill="url(#steel)" transform="translate(0,0)"/>
      <!-- 握把缠绕 -->
      <rect x="-6" y="0" width="12" height="25" rx="3" fill="#2a2a2a"/>
      <line x1="-6" y1="5" x2="6" y2="5" stroke="#444" stroke-width="0.8"/>
      <line x1="-6" y1="10" x2="6" y2="10" stroke="#444" stroke-width="0.8"/>
      <line x1="-6" y1="15" x2="6" y2="15" stroke="#444" stroke-width="0.8"/>
      <line x1="-6" y1="20" x2="6" y2="20" stroke="#444" stroke-width="0.8"/>
      <!-- 高光 -->
      <rect x="-2" y="-33" width="2" height="65" rx="1" fill="#fff" opacity="0.3"/>
    </g>
    <!-- 右拐 -->
    <g transform="translate(130,100)">
      <rect x="-5" y="-35" width="10" height="70" rx="3" fill="url(#steel)"/>
      <rect x="-5" y="-35" width="10" height="55" rx="3" fill="url(#steel)"/>
      <rect x="-6" y="0" width="12" height="25" rx="3" fill="#2a2a2a"/>
      <line x1="-6" y1="5" x2="6" y2="5" stroke="#444" stroke-width="0.8"/>
      <line x1="-6" y1="10" x2="6" y2="10" stroke="#444" stroke-width="0.8"/>
      <line x1="-6" y1="15" x2="6" y2="15" stroke="#444" stroke-width="0.8"/>
      <line x1="-6" y1="20" x2="6" y2="20" stroke="#444" stroke-width="0.8"/>
      <rect x="-2" y="-33" width="2" height="65" rx="1" fill="#fff" opacity="0.3"/>
    </g>
  </g>
  <!-- 云之炎粒子 -->
  <circle cx="50" cy="48" r="3" fill="#9370db" opacity="0.6"/>
  <circle cx="152" cy="52" r="2" fill="#b088f9" opacity="0.5"/>
  <circle cx="45" cy="155" r="2.5" fill="#9370db" opacity="0.4"/>
  <!-- 浮云装饰 -->
  <ellipse cx="155" cy="155" rx="15" ry="8" fill="#9370db" opacity="0.08"/>
  <ellipse cx="48" cy="160" rx="12" ry="6" fill="#9370db" opacity="0.06"/>
</svg>
