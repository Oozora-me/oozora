<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 牛角 - 蓝波 -->
  <defs>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#D2B48C"/>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#32cd32" stroke-width="1" opacity="0.2"/>
  <g transform="translate(100,105)" filter="url(#gl)">
    <!-- 左角 -->
    <path d="M-25,-10 Q-55,-60 -35,-80 Q-30,-70 -20,-50 Q-15,-30 -20,-10 Z" fill="url(#horn)" stroke="#6B5335" stroke-width="1"/>
    <!-- 右角 -->
    <path d="M25,-10 Q55,-60 35,-80 Q30,-70 20,-50 Q15,-30 20,-10 Z" fill="url(#horn)" stroke="#6B5335" stroke-width="1"/>
    <!-- 角上的闪电纹 -->
    <path d="M-30,-45 L-25,-35 L-32,-30" stroke="#32cd32" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M30,-45 L25,-35 L32,-30" stroke="#32cd32" stroke-width="1.5" fill="none" opacity="0.7"/>
    <!-- 牛纹头巾 -->
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="#f5f5f5"/>
    <ellipse cx="-12" cy="-5" rx="8" ry="6" fill="#333"/>
    <ellipse cx="12" cy="5" rx="6" ry="5" fill="#333"/>
    <ellipse cx="0" cy="12" rx="7" ry="5" fill="#333"/>
    <!-- 头巾带子 -->
    <path d="M-35,0 Q-40,15 -30,20" stroke="#32cd32" stroke-width="3" fill="none"/>
    <path d="M35,0 Q40,15 30,20" stroke="#32cd32" stroke-width="3" fill="none"/>
  </g>
  <!-- 雷之炎粒子 -->
  <circle cx="48" cy="48" r="3" fill="#32cd32" opacity="0.6"/>
  <circle cx="155" cy="50" r="2" fill="#66ff66" opacity="0.5"/>
  <circle cx="42" cy="158" r="2.5" fill="#32cd32" opacity="0.4"/>
  <!-- 闪电 -->
  <path d="M152,35 L148,50 L155,48 L150,65" stroke="#32cd32" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
