<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 炸药 sticks - 狱寺隼人 -->
  <defs>
    <linearGradient id="dyn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#4169e1" stroke-width="1" opacity="0.2"/>
  <g transform="translate(100,100)" filter="url(#gl)">
    <!-- 炸药1 - 左 -->
    <g transform="rotate(-20)">
      <rect x="-50" y="-5" width="60" height="10" rx="5" fill="url(#dyn)"/>
      <rect x="-52" y="-4" width="8" height="8" rx="1" fill="#d4a017"/>
      <!-- 引线 -->
      <path d="M-48,-4 Q-55,-20 -45,-30" stroke="#888" stroke-width="1.5" fill="none"/>
      <circle cx="-45" cy="-30" r="3" fill="#ff6600" opacity="0.8"/>
    </g>
    <!-- 炸药2 - 右 -->
    <g transform="rotate(15)">
      <rect x="-10" y="-5" width="60" height="10" rx="5" fill="url(#dyn)"/>
      <rect x="52" y="-4" width="8" height="8" rx="1" fill="#d4a017"/>
      <path d="M56,-4 Q63,-20 53,-30" stroke="#888" stroke-width="1.5" fill="none"/>
      <circle cx="53" cy="-30" r="3" fill="#ff6600" opacity="0.8"/>
    </g>
    <!-- 炸药3 - 中上 -->
    <g transform="rotate(-5) translate(0,-25)">
      <rect x="-35" y="-5" width="70" height="10" rx="5" fill="url(#dyn)" opacity="0.9"/>
      <rect x="37" y="-4" width="8" height="8" rx="1" fill="#d4a017"/>
      <path d="M41,-4 Q48,-18 38,-26" stroke="#888" stroke-width="1.5" fill="none"/>
      <circle cx="38" cy="-26" r="3" fill="#ff6600" opacity="0.8"/>
    </g>
  </g>
  <!-- 雨之炎粒子 -->
  <circle cx="48" cy="48" r="3" fill="#4169e1" opacity="0.6"/>
  <circle cx="155" cy="42" r="2" fill="#6b8cff" opacity="0.5"/>
  <circle cx="42" cy="158" r="2.5" fill="#4169e1" opacity="0.4"/>
</svg>
